name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'test/**'
      - 'README.md'
      - 'Agents.md'
      - 'AGENTS.md'
      - 'Pitch.md'

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: app
    permissions:
      contents: read
      deployments: write
    env:
      METADATA_PLUGIN_REPOSITORY: ${{ vars.METADATA_PLUGIN_REPOSITORY }}
      METADATA_PLUGIN_REF: ${{ vars.METADATA_PLUGIN_REF }}
      METADATA_PLUGIN_MODULE: ${{ vars.METADATA_PLUGIN_MODULE }}
      NUXT_HUB_CLOUDFLARE_DATABASE_ID: ${{ secrets.NUXT_HUB_CLOUDFLARE_DATABASE_ID }}
      NUXT_HUB_CLOUDFLARE_BUCKET_NAME: ${{ secrets.NUXT_HUB_CLOUDFLARE_BUCKET_NAME }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      NUXT_CLOUDFLARE_WORKER_NAME: libroo-production
      CLOUDFLARE_ACCESS_POLICY_ID: ${{ vars.CLOUDFLARE_ACCESS_POLICY_ID }}
      NUXT_CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
      NUXT_CLOUDFLARE_ACCESS_ENABLED: 'true'
      NUXT_CLOUDFLARE_CUSTOM_DOMAIN: ${{ vars.NUXT_CLOUDFLARE_CUSTOM_DOMAIN }}
      NUXT_BETTER_AUTH_SECRET: ${{ secrets.NUXT_BETTER_AUTH_SECRET }}
      NUXT_BETTER_AUTH_URL: ${{ vars.NUXT_BETTER_AUTH_URL }}
      NUXT_OIDC_CLIENT_SECRET: ${{ secrets.NUXT_OIDC_CLIENT_SECRET }}
      NUXT_OIDC_CLIENT_ID: ${{ vars.NUXT_OIDC_CLIENT_ID }}
      NUXT_OIDC_DISCOVERY_URL: ${{ vars.NUXT_OIDC_DISCOVERY_URL }}
      NUXT_OIDC_AUTHORIZATION_URL: ${{ vars.NUXT_OIDC_AUTHORIZATION_URL }}
      NUXT_OIDC_TOKEN_URL: ${{ vars.NUXT_OIDC_TOKEN_URL }}
      NUXT_OIDC_USER_INFO_URL: ${{ vars.NUXT_OIDC_USER_INFO_URL }}
      NUXT_OIDC_SCOPES: ${{ vars.NUXT_OIDC_SCOPES }}
      NUXT_OIDC_TRUST_PROVIDER: ${{ vars.NUXT_OIDC_TRUST_PROVIDER || 'false' }}
      NUXT_EMAIL_PASSWORD_ENABLED: ${{ vars.NUXT_EMAIL_PASSWORD_ENABLED || 'true' }}
      NUXT_PUBLIC_OIDC_ENABLED: ${{ vars.NUXT_PUBLIC_OIDC_ENABLED || 'false' }}
      NUXT_PUBLIC_OIDC_DISPLAY_NAME: ${{ vars.NUXT_PUBLIC_OIDC_DISPLAY_NAME }}
      NUXT_PUBLIC_OIDC_ICON: ${{ vars.NUXT_PUBLIC_OIDC_ICON }}
      NUXT_PLUNK_API_KEY: ${{ secrets.NUXT_PLUNK_API_KEY }}
      NUXT_EMAIL_FROM: ${{ vars.NUXT_EMAIL_FROM }}
      NUXT_EMAIL_REPLY_TO: ${{ vars.NUXT_EMAIL_REPLY_TO }}
      NUXT_EMAIL_VERIFICATION_ENABLED: ${{ vars.NUXT_EMAIL_VERIFICATION_ENABLED || 'true' }}
      NUXT_PLUNK_BASE_URL: ${{ vars.NUXT_PLUNK_BASE_URL }}
      NUXT_PUBLIC_REGISTRATION_ENABLED: ${{ vars.NUXT_PUBLIC_REGISTRATION_ENABLED || 'false' }}
      NUXT_PUBLIC_PASSKEYS_ENABLED: ${{ vars.NUXT_PUBLIC_PASSKEYS_ENABLED || 'false' }}
      NUXT_PUBLIC_TURNSTILE_ENABLED: ${{ vars.NUXT_PUBLIC_TURNSTILE_ENABLED || 'true' }}
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NUXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NUXT_TURNSTILE_ALLOWED_HOSTNAMES: ${{ vars.NUXT_TURNSTILE_ALLOWED_HOSTNAMES }}
      NUXT_TURNSTILE_SECRET_KEY: ${{ secrets.NUXT_TURNSTILE_SECRET_KEY }}
      NUXT_PUBLIC_LEGAL_PRIVACY_POLICY_URL: ${{ vars.NUXT_PUBLIC_LEGAL_PRIVACY_POLICY_URL }}
      NUXT_PUBLIC_LEGAL_IMPRINT_URL: ${{ vars.NUXT_PUBLIC_LEGAL_IMPRINT_URL }}
      NUXT_PUBLIC_LEGAL_TERMS_URL: ${{ vars.NUXT_PUBLIC_LEGAL_TERMS_URL }}
      NUXT_LEGAL_PRIVACY_POLICY_MARKDOWN_URL: ${{ vars.NUXT_LEGAL_PRIVACY_POLICY_MARKDOWN_URL }}
      NUXT_LEGAL_IMPRINT_MARKDOWN_URL: ${{ vars.NUXT_LEGAL_IMPRINT_MARKDOWN_URL }}
      NUXT_LEGAL_TERMS_MARKDOWN_URL: ${{ vars.NUXT_LEGAL_TERMS_MARKDOWN_URL }}
      NUXT_LEGAL_MARKDOWN_FETCH_TIMEOUT_SECONDS: ${{ vars.NUXT_LEGAL_MARKDOWN_FETCH_TIMEOUT_SECONDS || '5' }}
      NUXT_OPEN_LIBRARY_CONTACT_EMAIL: ${{ secrets.NUXT_OPEN_LIBRARY_CONTACT_EMAIL }}
      NUXT_OPEN_LIBRARY_COVER_TIMEOUT_SECONDS: ${{ vars.NUXT_OPEN_LIBRARY_COVER_TIMEOUT_SECONDS || '20' }}
      NUXT_OPEN_LIBRARY_REQUEST_TIMEOUT_SECONDS: ${{ vars.NUXT_OPEN_LIBRARY_REQUEST_TIMEOUT_SECONDS || '12' }}
      NUXT_PLUNK_SEND_TIMEOUT_SECONDS: ${{ vars.NUXT_PLUNK_SEND_TIMEOUT_SECONDS || '5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: app
          persist-credentials: false

      - name: Validate optional metadata module
        id: metadata
        env:
          METADATA_PLUGIN_SSH_KEY: ${{ secrets.METADATA_PLUGIN_SSH_KEY }}
        run: node scripts/production/metadata-module.mjs

      - name: Checkout optional private module
        if: steps.metadata.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.METADATA_PLUGIN_REPOSITORY }}
          ref: ${{ steps.metadata.outputs.ref }}
          ssh-key: ${{ secrets.METADATA_PLUGIN_SSH_KEY }}
          path: plugins
          persist-credentials: false

      - name: Record checked-out module commit
        if: steps.metadata.outputs.enabled == 'true'
        run: node scripts/production/metadata-module.mjs --record

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: app/package.json

      - name: Install node for private module builds
        if: steps.metadata.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2

      - name: Install node with public dependency cache
        if: steps.metadata.outputs.enabled != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install optional module dependencies
        if: steps.metadata.outputs.enabled == 'true'
        working-directory: plugins
        run: node ../app/scripts/production/run-command.mjs pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure optional module
        if: steps.metadata.outputs.enabled == 'true'
        run: node scripts/production/metadata-module.mjs --configure

      - name: Install dependencies
        run: node scripts/production/run-command.mjs pnpm install --frozen-lockfile

      - name: Test optional metadata module
        if: steps.metadata.outputs.enabled == 'true'
        working-directory: plugins
        env:
          LIBROO_CORE_DIR: ${{ github.workspace }}/app
        run: node ../app/scripts/production/run-command.mjs pnpm test

      - name: Validate production runtime configuration
        run: |
          set -euo pipefail
          node <<'NODE'
          const fail = (message) => {
            console.error(`::error::${message}`)
            process.exit(1)
          }
          const customDomain = process.env.NUXT_CLOUDFLARE_CUSTOM_DOMAIN
          if (!customDomain) {
            fail('NUXT_CLOUDFLARE_CUSTOM_DOMAIN must be configured.')
          }
          try {
            const expectedUrl = new URL(
              /^https?:\/\//.test(customDomain)
                ? customDomain
                : `https://${customDomain}`
            )
            const expectedOrigin = `https://${expectedUrl.host}`
            const authUrlValue = process.env.NUXT_BETTER_AUTH_URL || ''
            const authUrl = new URL(authUrlValue)
            if (authUrl.origin !== expectedOrigin || authUrlValue !== authUrl.origin) {
              fail(`NUXT_BETTER_AUTH_URL must exactly match ${expectedOrigin}.`)
            }
          } catch {
            fail('NUXT_BETTER_AUTH_URL must be a valid canonical HTTPS production origin.')
          }
          NODE
          if [[ "${NUXT_PUBLIC_TURNSTILE_ENABLED}" == "true" ]]; then
            if [[ -z "${NUXT_PUBLIC_TURNSTILE_SITE_KEY}" ]]; then
              echo "NUXT_PUBLIC_TURNSTILE_SITE_KEY is required when NUXT_PUBLIC_TURNSTILE_ENABLED=true."
              exit 1
            fi
            if [[ -z "${NUXT_TURNSTILE_SECRET_KEY}" ]]; then
              echo "NUXT_TURNSTILE_SECRET_KEY is required when NUXT_PUBLIC_TURNSTILE_ENABLED=true."
              exit 1
            fi
          fi
          if [[ -z "${NUXT_OPEN_LIBRARY_CONTACT_EMAIL}" ]]; then
            echo "NUXT_OPEN_LIBRARY_CONTACT_EMAIL is required for identified Open Library requests."
            exit 1
          fi

      - name: Validate production Worker secrets
        run: node scripts/production/worker-secrets.mjs --validate

      - name: Validate Cloudflare route permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ZONE_ID}" ]]; then
            echo "::error::CLOUDFLARE_ZONE_ID must be configured on the production Environment."
            exit 1
          fi
          custom_hostname="$(node -e '
            const value = process.env.NUXT_CLOUDFLARE_CUSTOM_DOMAIN
            const url = new URL(/^https?:\/\//.test(value) ? value : `https://${value}`)
            process.stdout.write(url.hostname)
          ')"
          route_pattern="libroo-route-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.${custom_hostname}/*"
          route_id=""
          cleanup_route() {
            if [[ -n "${route_id}" ]]; then
              curl --fail-with-body --silent --show-error \
                --request DELETE \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes/${route_id}" \
                > /dev/null
            fi
          }
          trap cleanup_route EXIT
          if ! route_response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$(jq --null-input --arg pattern "${route_pattern}" '{ pattern: $pattern }')" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes")"; then
            echo "::error::The production Cloudflare token needs Workers Routes Write access to the custom-domain zone."
            exit 1
          fi
          route_id="$(jq --raw-output '.result.id // empty' <<< "${route_response}")"
          if [[ -z "${route_id}" ]]; then
            echo "::error::Cloudflare did not return the temporary route ID."
            exit 1
          fi
          cleanup_route
          route_id=""
          trap - EXIT

      - name: Provision production D1 and R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production/provision-resources.mjs

      - name: Enforce private storage and production Access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production/secure-resources.mjs

      - name: Build Cloudflare worker
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/production/run-command.mjs pnpm build:cloudflare

      - name: Apply optional Worker placement hint
        env:
          NUXT_CLOUDFLARE_PLACEMENT_REGION: ${{ vars.NUXT_CLOUDFLARE_PLACEMENT_REGION }}
        run: node scripts/production/configure-worker-placement.mjs .output/server/wrangler.json

      - name: Validate production Wrangler configuration
        run: node scripts/production/validate-wrangler-config.mjs .output/server/wrangler.json

      - name: Register GitHub deployment
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PRODUCTION_ORIGIN: ${{ vars.NUXT_CLOUDFLARE_CUSTOM_DOMAIN }}
        with:
          script: |
            const environmentUrl = /^https?:\/\//.test(process.env.PRODUCTION_ORIGIN)
              ? process.env.PRODUCTION_ORIGIN
              : `https://${process.env.PRODUCTION_ORIGIN}`
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              payload: { metadata_plugin_commit: process.env.METADATA_PLUGIN_COMMIT || null },
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: true
            })
            core.setOutput('deployment_id', deployment.data.id)
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              environment: 'production',
              environment_url: environmentUrl,
              description: 'Deploying the production Cloudflare Worker'
            })

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote --config .output/server/wrangler.json

      - name: Sync production Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/production/worker-secrets.mjs | pnpm exec wrangler secret bulk --config .output/server/wrangler.json

      - name: Deploy production worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production/run-command.mjs pnpm exec wrangler deploy --config .output/server/wrangler.json

      - name: Publish production status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          JOB_STATUS: ${{ job.status }}
          PRODUCTION_ORIGIN: ${{ vars.NUXT_CLOUDFLARE_CUSTOM_DOMAIN }}
        with:
          script: |
            if (!process.env.DEPLOYMENT_ID) {
              core.info('Skipping production status because deployment registration did not complete.')
              return
            }
            const environmentUrl = /^https?:\/\//.test(process.env.PRODUCTION_ORIGIN)
              ? process.env.PRODUCTION_ORIGIN
              : `https://${process.env.PRODUCTION_ORIGIN}`
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              environment: 'production',
              environment_url: environmentUrl,
              description: process.env.JOB_STATUS === 'success'
                ? 'Production Cloudflare Worker deployed successfully'
                : 'Production Cloudflare Worker deployment failed'
            })
